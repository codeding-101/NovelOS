name: novelos

x-platform-env: &platform-env
  NOVELOS_ENV: ${NOVELOS_ENV:-production}
  NOVELOS_DB_HOST: postgres
  NOVELOS_DB_NAME: novelos
  NOVELOS_DB_USER: novelos
  NOVELOS_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  NOVELOS_MASTER_KEY: ${NOVELOS_MASTER_KEY:?Set NOVELOS_MASTER_KEY in .env}
  NOVELOS_PUBLIC_ORIGIN: ${NOVELOS_PUBLIC_ORIGIN:?Set NOVELOS_PUBLIC_ORIGIN in .env}
  NOVELOS_STORAGE_ROOT: /data/projections

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: novelos
      POSTGRES_USER: novelos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - platform-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novelos -d novelos"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build: ./backend
    image: novelos-backend
    environment: *platform-env
    command: ["python", "-m", "app.platform.cli", "upgrade"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: "no"

  backend:
    build: ./backend
    image: novelos-backend
    environment: *platform-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build: ./backend
    image: novelos-backend
    environment:
      <<: *platform-env
      NOVELOS_WORKER_ID: primary
    command: ["python", "-m", "app.platform.worker"]
    volumes:
      - platform-files:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: novelos-frontend
    environment:
      NOVELOS_BACKEND_URL: http://backend:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    image: caddy:2-alpine
    profiles: ["https"]
    environment:
      NOVELOS_DOMAIN: ${NOVELOS_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  platform-files:
  platform-postgres:
  caddy-data:
  caddy-config:
