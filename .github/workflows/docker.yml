name: docker

# 镜像构建与运行时冒烟测试。
#
# 为什么单独一个 workflow：tests.yml 只跑用例，验证不了「部署起来能不能用」。
# 之前 frontend/Dockerfile 里 COPY 一个不存在的 public/ 目录，就是这类问题 ——
# 本机没装 Docker 时，只能等到第一次部署才发现。这里让 CI 提前发现。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 准备一次性测试配置
        run: |
          python - <<'PY'
          import base64, os, pathlib
          key = base64.urlsafe_b64encode(os.urandom(32)).decode()
          pathlib.Path('.env').write_text(
              'NOVELOS_ENV=development\n'
              'NOVELOS_PUBLIC_ORIGIN=http://localhost:3000\n'
              'POSTGRES_PASSWORD=disposable-ci-password\n'
              f'NOVELOS_MASTER_KEY={key}\n'
          )
          PY

      - name: 校验 compose 文件
        run: docker compose config --quiet

      - name: 构建镜像（复用 GHA 层缓存）
        uses: docker/bake-action@v5
        with:
          files: docker-compose.yml
          load: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

      - name: 起服务并等健康检查通过
        run: |
          docker compose up -d --wait --wait-timeout 240
          docker compose ps

      - name: 冒烟测试（初始化、登录、权限与前端转发）
        env:
          NOVELOS_BOOTSTRAP_PASSWORD: disposable-ci-owner-password
        run: |
          set -euo pipefail
          docker compose exec -T -e NOVELOS_BOOTSTRAP_PASSWORD backend python -m app.platform.cli init-owner
          curl -fsS http://localhost:3000/ | grep -q NovelOS
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/v1/runtime)" = 401
          curl -fsS http://localhost:3000/api/v1/auth/status | grep -q '"initialized":true'
          curl -fsS -c /tmp/novelos-cookies -X POST http://localhost:3000/api/v1/auth/login \
            -H 'Content-Type: application/json' -H 'Origin: http://localhost:3000' \
            -d '{"username":"owner","password":"disposable-ci-owner-password"}' | grep -q '"authenticated":true'
          curl -fsS -b /tmp/novelos-cookies http://localhost:3000/api/v1/runtime | grep -q '"database":"postgresql"'
          docker compose restart backend worker
          sleep 5
          curl --retry 10 --retry-connrefused --retry-delay 2 -fsS -b /tmp/novelos-cookies http://localhost:3000/api/v1/runtime | grep -q '"database":"postgresql"'

      - name: 失败时打印容器日志
        if: failure()
        run: docker compose logs --tail=200

      - name: 收尾
        if: always()
        run: docker compose down -v
