name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 只跑开发机上验证过的版本；要加 3.11/3.12 请先本地跑通全部用例
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: 安装依赖
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-vector.txt   # 装了 numpy 会多跑一遍矩阵路径的代码

      - name: 静态检查（错误级）
        working-directory: backend
        run: |
          pip install ruff
          ruff check app tests --select F,E9

      - name: 跑离线用例
        working-directory: backend
        run: python -m pytest -q -rs
        # 联调用例需要 DEEPSEEK_API_KEY，走环境变量控制；CI 上默认跳过（conftest 已把提供者设为 offline）
